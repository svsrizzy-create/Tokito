
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKITO | Galaxy Profile</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --purple: #a855f7;
  --light: #d8a7ff;
}

body {
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 50% 0%, #38105e, transparent 48%),
    radial-gradient(ellipse at 90% 70%, #260747, transparent 40%),
    linear-gradient(150deg, #080313, #10051f, #03020a);
  overflow-x: hidden;
}

/* STAR BACKGROUND */
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* NEBULA */
.nebula {
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .25;
  pointer-events: none;
  z-index: 0;
  animation: nebula 9s ease-in-out infinite alternate;
}

.n1 {
  background: #a020ff;
  top: 5%;
  left: -140px;
}

.n2 {
  background: #5714c9;
  right: -140px;
  top: 55%;
  animation-delay: 3s;
}

@keyframes nebula {
  to {
    transform: translate(40px,60px) scale(1.3);
  }
}

/* SHOOTING STAR */
.shooting {
  position: fixed;
  top: 10%;
  left: -120px;
  width: 110px;
  height: 2px;
  background: linear-gradient(90deg, transparent, white, #bd6aff);
  box-shadow: 0 0 15px #b95cff;
  transform: rotate(-35deg);
  animation: shooting 5s linear infinite;
  z-index: 1;
}

@keyframes shooting {
  0% { left: -120px; top: 10%; opacity: 0; }
  10% { opacity: 1; }
  40% { left: 120%; top: 55%; opacity: 0; }
  100% { left: 120%; opacity: 0; }
}

/* CONTAINER */
.container {
  position: relative;
  z-index: 2;
  width: calc(100% - 30px);
  max-width: 420px;
  margin: 55px auto 35px;
  padding: 30px 22px;
  text-align: center;
  background: rgba(15,5,30,.68);
  border: 1px solid rgba(190,120,255,.3);
  border-radius: 25px;
  box-shadow:
    0 0 30px #8428ce22,
    inset 0 0 30px #a855f710;
  backdrop-filter: blur(15px);
  animation: entrance 1s ease both;
}

@keyframes entrance {
  from {
    opacity: 0;
    transform: translateY(40px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* PROFILE */
.profile-box {
  position: relative;
  width: 130px;
  height: 130px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: float 4s ease-in-out infinite;
}

.profile-box::before {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px dashed #b65aff;
  animation: rotate 12s linear infinite;
}

.profile-box::after {
  content: "";
  position: absolute;
  inset: -15px;
  border-radius: 50%;
  border: 1px solid #a855f755;
  animation: pulse 2.5s ease-in-out infinite;
}

.profile {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #c084fc;
  box-shadow: 0 0 25px #a855f7;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%,100% {
    transform: scale(.95);
    opacity: .3;
  }
  50% {
    transform: scale(1.12);
    opacity: 1;
  }
}

/* NAME */
h1 {
  margin-top: 24px;
  font-size: 32px;
  letter-spacing: 5px;
  text-shadow: 0 0 15px #b65aff, 0 0 30px #7e22ce;
  animation: glow 3s ease-in-out infinite alternate;
}

@keyframes glow {
  to {
    text-shadow: 0 0 25px #c084fc, 0 0 45px #9333ea;
  }
}

.verified {
  color: #c084fc;
  font-size: 16px;
}

.bio {
  margin-top: 12px;
  color: #c8b6df;
  font-size: 13px;
  line-height: 1.8;
}

.line {
  height: 1px;
  margin: 27px 0;
  background: linear-gradient(90deg, transparent, #bd70ff, transparent);
  box-shadow: 0 0 10px #a855f7;
}

.label {
  color: #d8a7ff;
  font-size: 11px;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

/* SOCIAL BUTTONS */
.link {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 17px;
  margin-bottom: 15px;
  border-radius: 15px;
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  border: 1px solid #c18aff66;
  transition: .35s;
  animation: buttonEntrance .8s ease both;
}

.link:nth-of-type(1) { animation-delay: .3s; }
.link:nth-of-type(2) { animation-delay: .5s; }
.link:nth-of-type(3) { animation-delay: .7s; }

@keyframes buttonEntrance {
  from {
    opacity: 0;
    transform: translateX(-25px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.link::before {
  content: "";
  position: absolute;
  top: 0;
  left: -110%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, #ffffff35, transparent);
  transform: skewX(-25deg);
  transition: .7s;
}

.link:hover::before {
  left: 150%;
}

.link:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 0 25px #a855f788;
}

.link:active {
  transform: scale(.96);
}

.channel {
  background: linear-gradient(110deg, #075d4d, #13a881);
}

.sociabuzz {
  background: linear-gradient(110deg, #a34a18, #e58a2d);
}

.tiktok {
  background: linear-gradient(110deg, #171717, #393044);
}

.icon {
  font-size: 23px;
  filter: drop-shadow(0 0 5px white);
}

/* SPARKLES */
.sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 5;
  color: #d8a7ff;
  text-shadow: 0 0 10px #c084fc;
  animation: sparkle 1.2s ease-out forwards;
}

@keyframes sparkle {
  0% {
    opacity: 1;
    transform: translateY(0) scale(.5) rotate(0);
  }
  100% {
    opacity: 0;
    transform: translateY(-70px) scale(1.5) rotate(180deg);
  }
}

/* FOOTER */
.footer {
  margin-top: 28px;
  color: #9581ae;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 2;
}

/* RESPONSIVE */
@media(max-width:380px) {
  .container {
    padding: 25px 16px;
  }

  h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="shooting"></div>

<div class="container">

  <div class="profile-box">
    <img class="profile"
    src="https://c.termai.cc/i114/hnzZ.jpg"
    alt="TOKITO Profile">
  </div>

  <h1>TOKITO <span class="verified">✦</span></h1>

  <p class="bio">
    Welcome to my personal page!<br>

  </p>

  <div class="line"></div>

  <p class="label">✦ MY SOCIAL MEDIA ✦</p>

  <a class="link channel"
  href="https://whatsapp.com/channel/0029Vb7UcZKEwEjzVsW53g2K"

    <span class="icon">📢</span>

  </a>

  <a class="link sociabuzz"
  href="https://sociabuzz.com/rizenm/tribe"

    <span class="icon">💰</span>
    Support Me - Sociabuzz
  </a>

  <a class="link tiktok"
  href="https://www.tiktok.com/@tokitotop"
  target="_blank" rel="noopener">
    <span class="icon">♪</span>
    Follow My TikTok
  </a>

  <div class="line"></div>

  <div class="footer">

  </div>

</div>

<script>
/* ANIMATED GALAXY STARS */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  stars = [];

  for (let i = 0; i < 110; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 1.8 + .3,
      speed: Math.random() * .35 + .08,
      alpha: Math.random(),
      fade: Math.random() * .015 + .003
    });
  }
}

function animateStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  stars.forEach(star => {
    star.y -= star.speed;
    star.alpha += star.fade;

    if (star.alpha >= 1 || star.alpha <= .15) {
      star.fade *= -1;
    }

    if (star.y < 0) {
      star.y = canvas.height;
      star.x = Math.random() * canvas.width;
    }

    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,180,255,${star.alpha})`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#a855f7";
    ctx.fill();
  });

  requestAnimationFrame(animateStars);
}

window.addEventListener("resize", resize);
resize();
animateStars();

/* TOUCH SPARKLE EFFECT */
document.addEventListener("pointerdown", function(e) {
  for (let i = 0; i < 5; i++) {
    const particle = document.createElement("span");
    particle.className = "sparkle";
    particle.textContent = "✦";
    particle.style.left = (e.clientX + Math.random() * 35 - 17) + "px";
    particle.style.top = (e.clientY + Math.random() * 35 - 17) + "px";
    particle.style.fontSize = (10 + Math.random() * 13) + "px";

    document.body.appendChild(particle);

    setTimeout(() => particle.remove(), 1200);
  }
});
</script>

</body>
</html>
